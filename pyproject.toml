[tool.poetry]
name = "neuroflow"
version = "0.0.1"
description = "Web forms that wrap neuroimaging CLI tools (one tool per page)"
authors = ["Antonio Carlos Senra Filho"]
readme = "README.md"
license = "MIT"
packages = [{ include = "neuroflow" }]

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = ">=0.115,<0.142"
python-multipart = ">=0.0.12,<0.0.33"
uvicorn = { extras = ["standard"], version = ">=0.32,<0.53" }
pydantic-settings = "^2.6.0"
rich = ">=13.9,<15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = ">=0.8,<0.17"
pre-commit = "^4.0.0"
debugpy = "^1.8.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

[tool.poetry.group.packaging.dependencies]
pyinstaller = { version = "^6.11.0", python = ">=3.10,<3.16" }
python-semantic-release = "^9.21.0"
# GitPython 3.1.60 removed Actor.name_email_regex; PSR 9.x still reads it
# (python-semantic-release/python-semantic-release#1475). Drop after PSR ships #1477.
gitpython = ">=3.1.59,<3.1.60"

[tool.poetry.scripts]
neuroflow = "neuroflow.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["neuroflow", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = [
    "neuroflow/__init__.py:__version__",
    "CITATION.cff:version",
]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
