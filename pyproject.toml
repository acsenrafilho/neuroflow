[tool.poetry]
name = "neuroflow"
version = "0.1.0"
description = "Facilitation portal for neuroscience medical image processing"
authors = ["Antonio Carlos Senra Filho"]
readme = "README.md"
license = "MIT"
packages = [{ include = "neuroflow" }]

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
nibabel = "^5.3.0"
pybids = "^0.19.0"
rich = "^13.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.8.0"
debugpy = "^1.8.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

[tool.poetry.scripts]
neuroflow = "neuroflow.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["neuroflow", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
