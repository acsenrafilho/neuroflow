<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroFlow | Home</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-surface font-body-md antialiased">
    <aside
      class="fixed left-0 top-0 z-50 flex h-full w-64 flex-col border-r border-outline-variant bg-surface-container-low py-6"
    >
      <div class="mb-8 px-6">
        <img
          src="/assets/neuroflow_logo.svg"
          alt="NeuroFlow logo"
          class="h-10 w-auto"
        />
        <p class="mt-1 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">
          v0.1.0
        </p>
      </div>
      <nav class="flex-1 space-y-1 px-2">
        <a
          href="/"
          class="flex items-center gap-3 border-l-4 border-primary bg-primary/10 px-4 py-3 font-semibold text-primary transition-all"
        >
          <span class="material-symbols-outlined text-primary">home</span>
          Home
        </a>
        <a
          href="#"
          class="flex items-center gap-3 border-l-4 border-transparent px-4 py-3 text-on-surface-variant hover:bg-surface-container"
        >
          <span class="material-symbols-outlined">database</span>
          Datasets
        </a>
        <a
          href="#"
          class="flex items-center gap-3 border-l-4 border-transparent px-4 py-3 text-on-surface-variant hover:bg-surface-container"
        >
          <span class="material-symbols-outlined">account_tree</span>
          Pipelines
        </a>
      </nav>
    </aside>

    <header
      class="fixed right-0 top-0 z-40 flex h-16 w-[calc(100%-16rem)] items-center justify-between border-b border-outline-variant bg-surface-container-lowest px-8"
    >
      <h1 class="font-headline-md text-on-surface">Home</h1>
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-on-surface-variant">help</span>
        <span class="material-symbols-outlined text-on-surface-variant">notifications</span>
      </div>
    </header>

    <main class="ml-64 min-h-screen px-10 pb-16 pt-24">
      <div class="mx-auto max-w-[960px]">
        <p class="text-on-surface-variant">
          Welcome to NeuroFlow. Application shell is ready; connect API workflows next.
        </p>
      </div>
    </main>
  </body>
</html>
