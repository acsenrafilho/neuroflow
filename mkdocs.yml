site_name: NeuroFlow
site_description: Facilitation portal for neuroscience medical image processing
site_url: https://neuroflowpipelines.readthedocs.io/
repo_url: https://github.com/acsenrafilho/neuroflow
repo_name: acsenrafilho/neuroflow

theme:
  name: material
  logo: assets/brand/neuroflow_icon.png
  favicon: assets/brand/neuroflow_icon.png
  font:
    text: Inter
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/acsenrafilho/neuroflow

plugins:
  - search

nav:
  - Home: index.md
  - User guide:
      - Overview: user/overview.md
      - Installation: user/installation.md
      - Using the portal: user/using.md
      - Workspaces and data: user/workspaces.md
      - Packages and modules: user/modules.md
      - T1 cervical morphometry (SCT): user/sct-t1-morphometry.md
      - Jobs, logs, and history: user/jobs.md
      - Host tools: user/host-tools.md
      - Tips: user/tips.md
      - FAQ: user/faq.md
      - Data and privacy: user/privacy.md
  - Getting started: getting-started.md
  - Developers:
      - Development: development.md
      - Contributing: contributing.md
      - Architecture: architecture.md
      - API: api.md
      - Security: security.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
