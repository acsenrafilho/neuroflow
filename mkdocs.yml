site_name: NeuroFlow
site_description: Facilitation portal for neuroscience medical image processing
site_url: https://neuroflowpipelines.readthedocs.io/
repo_url: https://github.com/acsenrafilho/neuroflow
repo_name: acsenrafilho/neuroflow

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - User guide:
      - Overview: user/overview.md
      - Installation: user/installation.md
      - Using the portal: user/using.md
      - Workspaces and data: user/workspaces.md
      - Packages and modules: user/modules.md
      - Jobs, logs, and history: user/jobs.md
      - Host tools: user/host-tools.md
      - Tips: user/tips.md
      - FAQ: user/faq.md
      - Data and privacy: user/privacy.md
  - Getting started: getting-started.md
  - Developers:
      - Development: development.md
      - Architecture: architecture.md
      - API: api.md
      - Security: security.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
