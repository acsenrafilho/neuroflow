name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.meta.outputs.released }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bootstrap v0.0.1 tag when none exist
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git describe --tags --match 'v*' --abbrev=0 >/dev/null 2>&1; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "v0.0.1" -m "chore(release): 0.0.1"
          git push origin "v0.0.1"
          gh release create "v0.0.1" \
            --title "v0.0.1" \
            --notes "Initial SemVer baseline. Packaged portal builds (Windows / macOS / Linux) are attached by the build-binaries job."
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"

      - name: Python Semantic Release
        id: release
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        uses: python-semantic-release/python-semantic-release@v9.21.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set job outputs
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ steps.bootstrap.outputs.bootstrapped }}" == "true" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            echo "version=0.0.1" >> "$GITHUB_OUTPUT"
          else
            echo "released=${{ steps.release.outputs.released }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash packaging/build_release.sh
          - os: macos-latest
            script: bash packaging/build_release.sh
          - os: windows-latest
            script: pwsh -File packaging/build_release.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Python deps (incl. PyInstaller)
        run: poetry install --no-interaction --with packaging

      - name: Build release zip
        env:
          NEUROFLOW_VERSION: ${{ needs.semantic-release.outputs.version }}
        run: ${{ matrix.script }}

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.semantic-release.outputs.tag }}"
          shopt -s nullglob
          assets=(dist/release/neuroflow-*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No zip artifacts found under dist/release/" >&2
            ls -la dist/release || true
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
