name: Feature request
description: Suggest an idea or a new module
title: "[ENH] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check existing issues before filing a duplicate request.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portal / hub
        - FreeSurfer
        - FSL
        - Spinal Cord Toolbox (SCT)
        - API
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should NeuroFlow do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups or links (no PHI).
