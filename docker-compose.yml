# Local development compose for NeuroFlow processing modules.
# Set NEUROFLOW_BIDS_ROOT in .env (default: ./data/sample)

services:
  fsl:
    build:
      context: ./docker/fsl
    environment:
      BIDS_ROOT: /data/bids
      SUBJECT: ${SUBJECT:-}
      SESSION: ${SESSION:-}
      PIPELINE_CONFIG_JSON: ${PIPELINE_CONFIG_JSON:-{}}
    volumes:
      - ${NEUROFLOW_BIDS_ROOT:-./data/sample}:/data/bids:ro

  ants:
    build:
      context: ./docker/ants
    environment:
      BIDS_ROOT: /data/bids
      SUBJECT: ${SUBJECT:-}
      SESSION: ${SESSION:-}
      PIPELINE_CONFIG_JSON: ${PIPELINE_CONFIG_JSON:-{}}
    volumes:
      - ${NEUROFLOW_BIDS_ROOT:-./data/sample}:/data/bids:ro
